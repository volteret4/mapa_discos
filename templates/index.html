<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Discos</title>
<link rel="stylesheet" href="/theme-palettes.css">
<style>
:root {
    --bg: #0f1020; --surface: #181a2e; --surface-2: #22253d; --border: #33375a;
    --text: #c0c6dc; --text-muted: #7c84a3; --accent: #7aa2f7; --accent-2: #bb9af7;
    --success: #9ece6a; --warning: #e0af68; --danger: #f7768e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text);
       display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border);
         background: var(--surface); flex-wrap: wrap; }
h1 { font-size: 17px; color: var(--text); white-space: nowrap; }
h1 span { color: var(--text-muted); font-weight: normal; }
.search { position: relative; flex: 1; min-width: 220px; max-width: 560px; }
.search input { width: 100%; padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--border);
                border-radius: 8px; color: var(--text); font-size: 14px; }
.search input:focus { outline: none; border-color: var(--accent); }
#results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface);
           border: 1px solid var(--border); border-radius: 8px; z-index: 50; max-height: 60vh; overflow-y: auto;
           display: none; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
#results.open { display: block; }
.result { padding: 7px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.result.active, .result:hover { background: var(--surface-2); }
.result .kind { color: var(--text-muted); width: 14px; flex-shrink: 0; text-align: center; }
.result .sub { color: var(--text-muted); font-size: 12px; margin-left: auto; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; max-width: 45%; }
.result .mark-local { color: var(--success); }
.result .mark-antiguo { color: var(--warning); }
.toolbar { display: flex; gap: 6px; }
button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 7px 12px;
         border-radius: 8px; cursor: pointer; font-size: 13px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
main { flex: 1; display: flex; min-height: 0; }
#cy-wrap { flex: 1; position: relative; min-width: 0; }
#cy { position: absolute; inset: 0; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
         color: var(--text-muted); padding: 24px; pointer-events: none; line-height: 1.6; }
#empty b { color: var(--text); }
#loading { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--surface);
           border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 12px;
           color: var(--text-muted); display: none; }
.legend { position: absolute; left: 12px; bottom: 44px; background: color-mix(in srgb, var(--surface) 88%, transparent);
          border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
          color: var(--text-muted); display: grid; gap: 4px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .l-local { border: 3px solid var(--success); }
.legend .l-antiguo { border: 2px dashed var(--warning); }
.legend .l-missing { border: 1px solid var(--border); opacity: .5; background: var(--surface-2); }
.legend .l-hub { border: 2px dashed var(--accent-2); border-radius: 6px; }
aside { width: 320px; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 16px; }
aside h2 { font-size: 18px; margin-bottom: 4px; color: var(--text); overflow-wrap: anywhere; }
aside .muted { color: var(--text-muted); font-size: 13px; line-height: 1.5; }
aside .cover { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--surface-2);
               margin-bottom: 12px; display: block; }
aside .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin-bottom: 10px;
                background: var(--surface-2); display: block; }
aside .state { display: inline-block; margin: 8px 0; padding: 2px 10px; border-radius: 12px; font-size: 12px;
               border: 1px solid var(--border); }
aside .state.local { color: var(--success); border-color: var(--success); }
aside .state.antiguo { color: var(--warning); border-color: var(--warning); border-style: dashed; }
aside .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
aside a { color: var(--accent); }
aside ul { list-style: none; margin-top: 10px; }
aside li { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; gap: 8px; }
aside li:hover { background: var(--surface-2); }
aside li .n { margin-left: auto; color: var(--text-muted); white-space: nowrap; }
aside li.antiguo { font-style: italic; color: var(--text-muted); }
aside li.in-map::before { content: "●"; color: var(--accent); font-size: 9px; align-self: center; }
aside .help p { margin-bottom: 10px; }
@media (max-width: 760px) {
    main { flex-direction: column; }
    aside { width: auto; height: 38vh; border-left: none; border-top: 1px solid var(--border); }
    .legend { display: none; }
    h1 span { display: none; }
}
</style>
</head>
<body>
<header>
    <h1>Mapa de Discos <span>— REPEAT-ONE</span></h1>
    <div class="search">
        <input id="q" type="search" placeholder="Busca un artista o un disco…  ( / )" autocomplete="off">
        <div id="results"></div>
    </div>
    <div class="toolbar">
        <button id="btn-fit" title="Encajar todo el mapa en pantalla">Encajar</button>
        <button id="btn-layout" title="Recolocar los nodos automáticamente">Reordenar</button>
    </div>
</header>
<main>
    <div id="cy-wrap">
        <div id="cy"></div>
        <div id="empty"><div><b>Busca un artista o un disco para empezar.</b><br>
            Verás sus álbumes originales alrededor; despliega <b>EPs</b> y <b>Géneros</b>,<br>
            y desde un género salta a otros artistas.</div></div>
        <div id="loading">Cargando…</div>
        <div class="legend">
            <div><i class="l-local"></i>Lo tienes</div>
            <div><i class="l-antiguo"></i>Lo tuviste (ya no está en local)</div>
            <div><i class="l-missing"></i>Te falta</div>
            <div><i class="l-hub"></i>Clic para desplegar / plegar</div>
        </div>
    </div>
    <aside id="panel"></aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="/static/app.js"></script>
<script src="/theme-picker.js"></script>
</body>
</html>
